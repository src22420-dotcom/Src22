# render.yaml

services:
  - type: web
    name: techvj-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -c "import asyncio; asyncio.set_event_loop(asyncio.new_event_loop())" && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app & python3 bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
